name: Render Video
on:
  workflow_dispatch:
    inputs:
      composition:
        description: 'Composition ID'
        required: true
        default: 'InternetShort'
      scale:
        description: 'Scale factor'
        required: false
        default: '1'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript
        run: npx tsc --noEmit 2>&1 || true
      - name: Render video
        run: npx remotion render src/index.ts ${{ github.event.inputs.composition }} out/video.mp4 --scale=${{ github.event.inputs.scale }} 2>&1 | tail -30
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: out/video.mp4
          if-no-files-found: ignore
